name: TunerTV Android TV test APK

on:
  push:
    branches: [main]
    paths:
      - 'tunertv/**'
      - '.github/workflows/tunertv.yml'
  pull_request:
    paths:
      - 'tunertv/**'
      - '.github/workflows/tunertv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test parsers and build TunerTV prototype APK
        run: gradle --no-daemon -p tunertv :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TunerTV-0.1.1-debug-test-only
          path: tunertv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
