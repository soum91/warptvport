name: TunerTV Android TV test APK

on:
  push:
    branches: [main]
    paths:
      - 'tunertv/**'
      - '.github/workflows/tunertv.yml'
  pull_request:
    paths:
      - 'tunertv/**'
      - '.github/workflows/tunertv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed version UI contract
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 "$GITHUB_WORKSPACE/scripts/check_version_ui.py"
          else
            python "$GITHUB_WORKSPACE/scripts/check_version_ui.py"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test TunerTV parsers
        continue-on-error: true
        run: gradle --no-daemon -p tunertv :app:testDebugUnitTest
      - name: Build TunerTV prototype APK
        run: gradle --no-daemon -p tunertv :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TunerTV-0.1.1-debug-test-only
          path: tunertv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
